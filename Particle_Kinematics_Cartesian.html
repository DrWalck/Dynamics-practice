<style>
:root{
  --bg:#eef1f5; --grid:rgba(29,79,145,.06); --surface:#ffffff; --surface-2:#f6f8fb;
  --ink:#16202c; --muted:#5a6878; --line:#d5dce5;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ecf8;
  --hl:#fbe7a1; --hl-ink:#3d2f00;
  --good:#1f7a4d; --good-soft:#e1f3e9; --warn:#9a6200; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --plot-2:#c2571a;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e131a; --grid:rgba(127,176,240,.05); --surface:#161e28; --surface-2:#1c2632;
    --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3644;
    --accent:#7fb0f0; --accent-ink:#0e131a; --accent-soft:#1f3350;
    --hl:#4a3f17; --hl-ink:#fbe7a1;
    --good:#5cc58e; --good-soft:#15301f; --warn:#e0a84a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1a18;
    --plot-2:#f0a070;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131a; --grid:rgba(127,176,240,.05); --surface:#161e28; --surface-2:#1c2632;
  --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3644;
  --accent:#7fb0f0; --accent-ink:#0e131a; --accent-soft:#1f3350;
  --hl:#4a3f17; --hl-ink:#fbe7a1;
  --good:#5cc58e; --good-soft:#15301f; --warn:#e0a84a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1a18;
  --plot-2:#f0a070;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-inline:16px; padding-block:0 48px;
}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-block:28px 20px;border-bottom:2px solid var(--ink);margin-bottom:24px}
header.top h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.back{display:inline-block;font:600 .9rem var(--body);color:var(--accent);text-decoration:none;margin-bottom:8px}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top p{margin:0;color:var(--muted);font-size:.95rem;max-width:52ch}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
nav.problems{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:18px}
.topic h2{font-family:var(--display);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.topic ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.topic button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;width:100%;padding:8px 10px;border-radius:6px;border:1px solid transparent}
.topic button:hover{background:var(--surface)}
.topic button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.topic button[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.topic .pname{font-weight:600}
.topic .ptag{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.soon{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}

main.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:24px;min-width:0}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:.8rem;font-weight:600;color:var(--accent)}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.phead h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.1rem);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 .95rem/1 var(--body);padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.statement{font-size:1.08rem;max-width:68ch;margin:0}
.num{font-family:var(--mono);font-size:.92em;background:var(--hl);color:var(--hl-ink);padding:0 .3em;border-radius:3px;white-space:nowrap}
.variant{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface-2)}
.box h3{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.box li{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.box li .v{font-family:var(--mono);font-size:.92rem}
.method{font-size:.95rem;color:var(--muted);margin:0}
.method b{color:var(--ink)}

.answers h3{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;font-weight:600}
.arow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) 11rem;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.arow label{font-weight:600}
.arow .inp{display:flex;align-items:center;gap:6px}
.arow input{width:100%;min-width:0;font:1rem var(--mono);padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.arow input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.arow .unit{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap;min-width:4.2em}
.chip{font:600 .8rem/1 var(--body);padding:6px 10px;border-radius:999px;white-space:nowrap;justify-self:start}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.idle{color:var(--muted)}
.checkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.hint{font-size:.85rem;color:var(--muted)}

.solution{border-top:2px solid var(--ink);padding-top:20px;display:flex;flex-direction:column;gap:16px}
.solution h3{font-family:var(--display);font-size:1.3rem;margin:0;font-weight:700}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:4px 10px}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-weight:600;color:var(--accent);border:1.5px solid var(--accent);border-radius:50%;width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.8rem}
.step-title{font-weight:600;align-self:center}
.step-body{grid-column:2;display:flex;flex-direction:column;gap:6px;min-width:0}
.eq{overflow-x:auto;padding:6px 0;font-size:1.12rem}
.eq math{font-size:1.12em}
.note{font-size:.92rem;color:var(--muted);margin:0}
.final{display:flex;flex-wrap:wrap;gap:10px}
.final .ans{border:2px solid var(--accent);border-radius:8px;padding:10px 14px;background:var(--accent-soft)}
.final .ans .k{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--display);font-weight:600}
.final .ans .val{font-family:var(--mono);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.plotwrap{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}
.plotwrap figcaption{font-size:.85rem;color:var(--muted);margin-bottom:6px}
canvas{display:block;width:100%;height:260px}
.takeaway{border-left:3px solid var(--hl);background:var(--surface-2);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.95rem;margin:0}

@media (max-width:780px){
  .layout{grid-template-columns:1fr}
  nav.problems{position:static}
  .topic ul{flex-direction:row;flex-wrap:wrap}
  .topic li{flex:1 1 150px}
  .soon{display:none}
  .arow{grid-template-columns:1fr auto}
  .arow label{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){
  .solution{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
sub{font-size:.72em;line-height:0;vertical-align:-.25em}
.eyebrow sub,.topic h2 sub{text-transform:none}
/* SCHEM-CSS-START */
.probtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:18px;align-items:start}
@media (max-width:900px){.probtop{grid-template-columns:1fr}}
.schem{margin:0;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 8px 4px}
.schem figcaption{font-size:.74rem;color:var(--muted);text-align:right;margin-top:2px}
.diag{width:100%;height:auto;display:block;overflow:visible}
.diag .s,.diag .spr{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.diag .thin{stroke:var(--ink);stroke-width:1.1;fill:none}
.diag .h{stroke:var(--muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.diag .h2{stroke:var(--muted);stroke-width:1.2;fill:none}
.diag .hatch{stroke:var(--muted);stroke-width:1}
.diag .v{stroke:var(--accent);stroke-width:2.2;fill:none}
.diag .f{stroke:var(--plot-2);stroke-width:2.2;fill:none}
.diag .body{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.6}
.diag .body2{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.diag .pinb,.diag .pinc{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.diag .dotk{fill:var(--ink)} .diag .dotv{fill:var(--accent)} .diag .dotf{fill:var(--plot-2)}
.diag .dimln{stroke:var(--muted);stroke-width:1} .diag .ext{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 3}
.diag .ms{fill:var(--muted)} .diag .mv{fill:var(--accent)} .diag .mf{fill:var(--plot-2)}
.diag text{font-family:var(--body);font-size:12.5px}
.diag .t,.diag .ts{fill:var(--ink)} .diag .tv{fill:var(--accent);font-weight:600} .diag .tf{fill:var(--plot-2);font-weight:600} .diag .tm{fill:var(--muted)}
/* SCHEM-CSS-END */
/* MLAB-CSS-START */
/* ---------- hints ---------- */
.hints{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hintcard{border:1px solid rgba(255,210,63,.35);background:rgba(255,210,63,.06);border-radius:10px;padding:10px 14px;font-size:.95rem}
.hintcard .hk{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#ffe27a;margin-bottom:3px}
#hintbtn{border-color:rgba(255,210,63,.5);color:#ffe27a}
#hintbtn:hover{box-shadow:0 0 16px -4px #ffd23f}
#hintbtn:disabled{opacity:.5;cursor:default;box-shadow:none}
/* ---------- meaning ---------- */
.arow{grid-template-rows:auto auto}
.sense{grid-column:1/-1;font-size:.9rem;color:#c9d6f2;padding:2px 0 4px;border-left:2px solid var(--good);padding-left:10px;margin-top:-2px}
.sense .sk,.final .mean .sk{font-family:var(--display);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--good);margin-right:6px}
.final .ans{max-width:100%}
.final .mean{font-size:.82rem;color:#c9d6f2;margin-top:6px;max-width:30ch;line-height:1.35}
/* ---------- MATLAB panel ---------- */
#mlab:empty{display:none}
.mlab{border:1px solid #2a3f70;border-radius:12px;background:rgba(8,14,30,.75);overflow:hidden}
.mlab summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-weight:600;letter-spacing:.03em;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mlab summary::marker{color:#ff8a3d}
.mlt{background:#ff8a3d;color:#1a0a00;font-size:.7rem;letter-spacing:.14em;padding:3px 8px;border-radius:6px;font-weight:700}
.mlsub{color:var(--muted);font-weight:500;font-size:.85rem;letter-spacing:.02em}
.mlbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.mlhelp{margin:0;font-size:.9rem;color:var(--muted)}
.mlhelp code{font-family:var(--mono);font-size:.85em;color:#ffe27a;background:rgba(255,210,63,.1);padding:0 .3em;border-radius:3px}
.mlcode{font-family:var(--mono);font-size:.86rem;line-height:1.75;background:#070c19;border:1px solid #1e2d52;border-radius:10px;padding:10px 0;overflow-x:auto;white-space:pre}
.mlcode .cl{display:flex;gap:12px;padding:0 12px;min-height:1.75em}
.mlcode .cl.err{background:rgba(255,92,138,.14);box-shadow:inset 3px 0 0 var(--bad)}
.mlcode .ln{color:#3f5382;min-width:2ch;text-align:right;user-select:none;flex:none}
.mlcode .ct{color:#d6e2ff;white-space:pre}
.mlcode .c{color:#6ea86e;font-style:italic}
.mlcode .s{color:#c39dff}
.mlcode .n{color:#ffb35c}
.mlcode .k{color:#5eeaff}
.mlcode .f{color:#8ee7ff}
.blank{position:relative;display:inline-flex;align-items:center;gap:2px;vertical-align:baseline}
.mb{font:inherit;color:#fff;background:#0d1a3a;border:1px dashed #5a78c4;border-radius:6px;padding:0 8px;height:1.55em;line-height:1.55em;transition:border-color .15s,box-shadow .15s}
.mb:focus{outline:none;border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.mb.ok{border-style:solid;border-color:var(--good);background:rgba(124,255,107,.1);box-shadow:0 0 10px -3px var(--good)}
.mb.bad{border-style:solid;border-color:var(--bad);background:rgba(255,92,138,.1)}
.mbh{font:700 .72rem var(--display);width:1.4em;height:1.4em;border-radius:50%;border:1px solid rgba(255,210,63,.6);background:rgba(255,210,63,.12);color:#ffe27a;cursor:pointer;padding:0;line-height:1}
.mbh:hover{background:rgba(255,210,63,.3)}
.mbtip{position:absolute;left:0;top:calc(100% + 6px);z-index:5;background:#141b33;border:1px solid rgba(255,210,63,.5);color:#ffe9a8;font:.8rem var(--body);line-height:1.35;padding:8px 10px;border-radius:8px;white-space:normal;width:max-content;max-width:min(360px,80vw);box-shadow:0 10px 30px -10px #000}
.mlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mlbar .hint.good{color:var(--good)}
.mlout{border:1px solid #1e2d52;border-radius:10px;background:#03060f;overflow:hidden}
.mlouth{font-family:var(--display);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-bottom:1px solid #1e2d52;background:#0a1226}
.mlout pre{margin:0;padding:10px 12px;font:.86rem/1.5 var(--mono);color:#d6e2ff;white-space:pre-wrap;overflow-x:auto}
.mlout pre.haserr{color:#ffb4c6}
@media (max-width:600px){.mlcode{font-size:.8rem}.mb{max-width:60vw}}
/* MLAB-CSS-END */
/* GAME-CSS-START */
/* ---------- Neon "game" theme (overrides everything above) ---------- */
:root:root:root{
  color-scheme:dark;
  --bg:#060a14; --grid:rgba(34,211,238,.05); --surface:rgba(13,20,38,.86); --surface-2:#0e1730; --surface-3:#15213f;
  --ink:#e9f1ff; --muted:#97a7c9; --line:#23345c;
  --accent:#22d3ee; --accent-ink:#04121a; --accent-soft:rgba(34,211,238,.10);
  --hl:rgba(255,210,63,.13); --hl-ink:#ffe27a;
  --good:#7cff6b; --good-soft:rgba(124,255,107,.11); --warn:#ffd23f; --warn-soft:rgba(255,210,63,.12); --bad:#ff5c8a; --bad-soft:rgba(255,92,138,.13);
  --plot-2:#ff8a3d; --mag:#ff4fd8; --vio:#8b5cf6;
  --display:"Chakra Petch","Barlow Semi Condensed",system-ui,sans-serif;
  --grad:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 55%,#ff4fd8 100%);
}
html{background:#060a14}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 520px at 5% -8%,rgba(139,92,246,.20),transparent 62%),
    radial-gradient(800px 480px at 105% 0%,color-mix(in srgb,var(--zone) 20%,transparent),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;
}
::selection{background:rgba(34,211,238,.35)}

/* header */
header.top{border-bottom:none;position:relative;padding-block:26px 22px;align-items:flex-end}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--zone),#8b5cf6,transparent);box-shadow:0 0 14px var(--zone)}
header.top h1{font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#ffffff 20%,var(--zone));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.back{color:var(--zone);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
header.top p{flex:1 1 320px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;flex:0 1 auto}
.hud .cell{display:flex;align-items:center;gap:8px;background:rgba(10,16,32,.9);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-family:var(--display);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.hud .cell svg{width:18px;height:18px;flex:none}
.hud .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.hud .n{font-size:1.05rem;font-variant-numeric:tabular-nums}
.hud .lvl{border-color:rgba(139,92,246,.6);box-shadow:0 0 16px -6px #8b5cf6}
.hud .lvl .n{color:#c4b5fd}
.hud .xpbar{width:84px;height:7px;border-radius:9px;background:#1a2648;overflow:hidden}
.hud .xpbar i{display:block;height:100%;background:var(--grad);box-shadow:0 0 10px #22d3ee;transition:width .5s}
.hud .streak .n{color:#ffb35c}.hud .streak svg{color:#ff8a3d;filter:drop-shadow(0 0 5px #ff8a3d)}
.hud .clr .n{color:var(--good)}.hud .clr svg{color:var(--good);filter:drop-shadow(0 0 4px var(--good))}
.hud .xp svg{color:#22d3ee;filter:drop-shadow(0 0 4px #22d3ee)}
.hud .bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}

/* panels */
.concepts,main.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 1px rgba(34,211,238,.04),0 24px 60px -24px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
main.sheet{border-top:2px solid color-mix(in srgb,var(--zone) 70%,transparent)}
.concepts summary{font-family:var(--display);letter-spacing:.03em;color:#fff}
.concepts summary::marker{color:var(--zone)}
.cgrid h4{color:var(--zone)}

.topic button.solved .pname::after{content:"✓";display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:.45em;border-radius:50%;font-size:.72em;background:var(--good);color:#06210a;box-shadow:0 0 8px var(--good);vertical-align:.1em}

.variant{color:#8ea3cf}
.btn{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;font-size:.84rem;padding:11px 15px;border-radius:9px;background:var(--surface-3);border:1px solid #2c4274;color:var(--ink);transition:transform .12s,box-shadow .15s,border-color .15s}

.btn.primary{background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#050b18;border-color:transparent;font-weight:700;box-shadow:0 0 18px -6px #22d3ee}

@media (prefers-reduced-motion:no-preference){.chip.good,.chip.warn,.chip.bad{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}}

/* solution */

<div class="wrap">
  <header class="top">
    <div><a class="back" href="./">&larr; All topics</a><h1>Particle Kinematics: Cartesian</h1></div>
    <p>Every problem gets fresh numbers each time you press <b>New numbers</b>. Work it on paper, check your answer, then open the worked solution.</p>
  </header>
  <div class="layout">
    <nav class="problems" id="nav" aria-label="Problems"></nav>
    <main class="sheet" id="sheet" aria-live="polite"></main>
  </div>
</div>

<script>
/* =====================================================================
   HELPERS
   ===================================================================== */
const T = String.raw;
const g = 9.81;
function pick(min, max, step){ const n = Math.round((max-min)/step); return +(min + step*Math.floor(Math.random()*(n+1))).toFixed(6); }
function fmt(x, sig=4){ if(!isFinite(x)) return "—"; if(Math.abs(x) < 1e-12) return "0"; return String(Number(x.toPrecision(sig))); }
function sgn(x, sig=4){ return (x < 0 ? " - " : " + ") + fmt(Math.abs(x), sig); }   // signed term for equations
function tex(s, display=true){
  if(window.katex){ try{ return katex.renderToString(s,{output:"mathml",displayMode:display,throwOnError:false}); }catch(e){} }
  return '<code>'+s.replace(/</g,"&lt;")+'</code>';
}
function N(x, unit="", sig=4){ return `<span class="num">${fmt(x,sig)}${unit?"&nbsp;"+unit:""}</span>`; }

/* =====================================================================
   PROBLEM BANK
   To add a problem, copy one object below and edit:
     id, topic, name, tag, original (the numbers from your notes),
     randomize() -> new givens, solve(v) -> computed values,
     statement, given, find, method, answers, steps, plot, takeaway
   ===================================================================== */
const PROBLEMS = [

/* ---------- 1. Private plane: constant acceleration ---------- */
{
  id:"plane", topic:"Particle Kinematics · Cartesian", name:"Private Plane", tag:"a = const",
  kind:"Rectilinear motion",
  original:{ mph:60, a:-10 },
  randomize(){ return { mph:pick(45,95,5), a:-pick(6,16,1) }; },
  solve(v){ const v1=v.mph*5280/3600, t2=v1/(-v.a), s2=v1*v1/(-2*v.a); return {v1,t2,s2}; },
  statement:(v)=>`A small private plane touches down at ${N(v.mph,"mph")} and brakes with a constant deceleration of ${N(-v.a,"ft/s²")}. Find how long it takes to stop and the minimum runway length required.`,
  given:(v,r)=>[["v₁",`${fmt(v.mph)} mph`],["a",`${fmt(v.a)} ft/s² (constant)`],["t₁, s₁",`0, 0`],["v₂","0 (stopped)"]],
  find:["Stopping time t₂","Runway length s₂"],
  method:"Kinematic relations, 4-step procedure: a = dv/dt, separate variables, integrate, solve. Then repeat with v = ds/dt.",
  answers:(v,r)=>[
    {label:"Stopping time t₂", unit:"s", val:r.t2},
    {label:"Runway length s₂", unit:"ft", val:r.s2}],
  steps(v,r){ const A=-v.a; return [
    {t:"Convert the landing speed to ft/s", eq:T`v_1=${fmt(v.mph)}\,\tfrac{\text{mi}}{\text{h}}\cdot\tfrac{5280\ \text{ft}}{1\ \text{mi}}\cdot\tfrac{1\ \text{h}}{3600\ \text{s}}=${fmt(r.v1)}\ \text{ft/s}`},
    {t:"Kinematic relation and separate variables", eq:T`a=\frac{dv}{dt}\;\Rightarrow\;a\,dt=dv`},
    {t:"Integrate from the initial state", eq:T`\int_0^{t}(-${fmt(A)})\,dt=\int_{${fmt(r.v1)}}^{v}dv\;\Rightarrow\;v(t)=${fmt(r.v1)}-${fmt(A)}t`,
      note:"Plug in only the initial state so the result is a velocity function."},
    {t:"State 2: the plane stops (v = 0)", eq:T`0=${fmt(r.v1)}-${fmt(A)}t_2\;\Rightarrow\;t_2=\frac{${fmt(r.v1)}}{${fmt(A)}}=${fmt(r.t2)}\ \text{s}`},
    {t:"Repeat for position with v = ds/dt", eq:T`\int_0^{t}(${fmt(r.v1)}-${fmt(A)}t)\,dt=\int_0^{s}ds\;\Rightarrow\;s(t)=${fmt(r.v1)}t-${fmt(A/2)}t^2`},
    {t:"Evaluate at t₂", eq:T`s_2=${fmt(r.v1)}(${fmt(r.t2)})-${fmt(A/2)}(${fmt(r.t2)})^2=${fmt(r.s2)}\ \text{ft}`},
    {t:"Check with the constant-acceleration equation", eq:T`v_2^2=v_1^2+2a\,\Delta s\;\Rightarrow\;0=${fmt(r.v1)}^2+2(-${fmt(A)})s_2\;\Rightarrow\;s_2=${fmt(r.s2)}\ \text{ft}\ \checkmark`}
  ];},
  takeaway:"This is the minimum runway length. Because a is constant, the 4-step procedure and the constant-acceleration equations give the same answer.",
  plot(v,r){ const pts=[]; for(let i=0;i<=60;i++){const t=r.t2*i/60; pts.push([t, r.v1*t+0.5*v.a*t*t]);} return {xl:"t (s)", yl:"s (ft)", series:[{pts,label:"s(t)"}], mark:[r.t2,r.s2], cap:"Position vs. time. The curve flattens as the plane slows; the dot marks the stop."}; }
},

/* ---------- 2. Scotch yoke: a(t) ---------- */
{
  id:"yoke", topic:"Particle Kinematics · Cartesian", name:"Scotch Yoke", tag:"a(t)",
  kind:"Linear motion",
  original:{ A:1.8, k:3, v0:0.6, t2:0.5 },
  randomize(){ return { A:pick(1.2,3.0,0.1), k:pick(2,5,0.5), v0:pick(0.3,1.0,0.1), t2:pick(0.2,1.0,0.1) }; },
  solve(v){ const B=v.A/v.k, C=v.v0-B, kt=v.k*v.t2; const v2=C+B*Math.cos(kt), x2=C*v.t2+(v.A/(v.k*v.k))*Math.sin(kt); return {B,C,kt,v2,x2}; },
  statement:(v)=>`The slider A of a Scotch yoke mechanism has acceleration a = −${N(v.A)} sin(${N(v.k)} t) m/s², with t in seconds. At t = 0 it is at x = 0 moving with v = ${N(v.v0,"m/s")}. Find its velocity and position at t = ${N(v.t2,"s")}.`,
  given:(v)=>[["a(t)",`−${fmt(v.A)} sin(${fmt(v.k)}t) m/s²`],["x₁, t₁","0, 0"],["v₁",`${fmt(v.v0)} m/s`],["t₂",`${fmt(v.t2)} s`]],
  find:["Velocity v(t₂)","Position x(t₂)"],
  method:"Acceleration is a function of time, so integrate a = dv/dt directly, then v = dx/dt. Angles are in radians.",
  answers:(v,r)=>[
    {label:"Velocity v(t₂)", unit:"m/s", val:r.v2},
    {label:"Position x(t₂)", unit:"m", val:r.x2}],
  steps(v,r){ const K2=v.A/(v.k*v.k); return [
    {t:"Kinematic relation, separate, integrate", eq:T`a=\frac{dv}{dt}\;\Rightarrow\;\int_{${fmt(v.v0)}}^{v}dv=-${fmt(v.A)}\int_0^{t}\sin(${fmt(v.k)}t)\,dt`},
    {t:"Evaluate the integral", eq:T`v-${fmt(v.v0)}=\frac{${fmt(v.A)}}{${fmt(v.k)}}\big[\cos(${fmt(v.k)}t)-1\big]`},
    {t:"Velocity function", eq:T`v(t)=${fmt(r.C)}${sgn(r.B)}\cos(${fmt(v.k)}t)\ \text{m/s}`,
      note: Math.abs(r.C)<1e-9 ? "Here v₁ equals A/k, so the constant term cancels (same as in the original example)." : `The constant term is v₁ − A/k = ${fmt(v.v0)} − ${fmt(r.B)} = ${fmt(r.C)}. In the original example this was zero because v₁ = A/k.`},
    {t:"Velocity at t₂ (radians!)", eq:T`v(${fmt(v.t2)})=${fmt(r.C)}${sgn(r.B)}\cos(${fmt(r.kt)})=${fmt(r.v2,3)}\ \text{m/s}`},
    {t:"Repeat with v = dx/dt", eq:T`\int_0^{t}\Big(${fmt(r.C)}${sgn(r.B)}\cos(${fmt(v.k)}t)\Big)dt=\int_0^{x}dx\;\Rightarrow\;x(t)=${fmt(r.C)}\,t${sgn(K2)}\sin(${fmt(v.k)}t)`,
      note:`The sine coefficient is A/k² = ${fmt(v.A)}/${fmt(v.k)}² = ${fmt(K2)}.`},
    {t:"Position at t₂", eq:T`x(${fmt(v.t2)})=${fmt(r.C)}(${fmt(v.t2)})${sgn(K2)}\sin(${fmt(r.kt)})=${fmt(r.x2,3)}\ \text{m}`}
  ];},
  takeaway:"Set your calculator to radians: k·t is an angle in radians. With a = a(t), no chain rule is needed.",
  plot(v,r){ const T2=Math.max(v.t2*1.6, 2*Math.PI/v.k); const p1=[],p2=[]; for(let i=0;i<=120;i++){const t=T2*i/120; p1.push([t,r.C+r.B*Math.cos(v.k*t)]); p2.push([t,r.C*t+(v.A/(v.k*v.k))*Math.sin(v.k*t)]);} return {xl:"t (s)", yl:"v (m/s), x (m)", series:[{pts:p1,label:"v(t)"},{pts:p2,label:"x(t)",alt:true}], mark:[v.t2,r.v2], mark2:[v.t2,r.x2], cap:"Velocity (blue) and position (orange) over one full cycle. Dots mark t₂."}; }
},

/* ---------- 3. Parachute: a(v) ---------- */
{
  id:"chute", topic:"Particle Kinematics · Cartesian", name:"Parachute", tag:"a(v)",
  kind:"Rectilinear motion",
  original:{ c:0.004, v1:50, v2:10 },
  randomize(){ return { c:pick(0.002,0.008,0.001), v1:pick(35,75,5), v2:pick(6,20,1) }; },
  solve(v){ const t2=(1/v.v2-1/v.v1)/v.c; return {t2}; },
  statement:(v)=>`When a parachute opens, the jumper's deceleration depends on speed: a = −${N(v.c)} v² m/s² (v in m/s). The chute opens at t = 0 when v = ${N(v.v1,"m/s")}. How long until the jumper slows to ${N(v.v2,"m/s")}?`,
  given:(v)=>[["a(v)",`−${fmt(v.c)} v² m/s²`],["t₁","0"],["v₁",`${fmt(v.v1)} m/s`],["v₂",`${fmt(v.v2)} m/s`]],
  find:["Time t₂"],
  method:"Acceleration is a function of velocity: use a = dv/dt, move v to the dv side, then integrate.",
  answers:(v,r)=>[{label:"Time t₂", unit:"s", val:r.t2}],
  steps(v,r){ return [
    {t:"Kinematic relation with a(v)", eq:T`a(v)=\frac{dv}{dt}\;\Rightarrow\;-${fmt(v.c)}\,v^2=\frac{dv}{dt}`},
    {t:"Separate variables and integrate", eq:T`-${fmt(v.c)}\int_0^{t}dt=\int_{${fmt(v.v1)}}^{v}\frac{1}{v^2}\,dv`,
      note:"Power rule: ∫v⁻² dv = v⁻¹/(−1) = −1/v."},
    {t:"Evaluate", eq:T`-${fmt(v.c)}\,t=-\frac{1}{v}+\frac{1}{${fmt(v.v1)}}`},
    {t:"Plug in state 2 and solve", eq:T`-${fmt(v.c)}\,t_2=-\frac{1}{${fmt(v.v2)}}+\frac{1}{${fmt(v.v1)}}\;\Rightarrow\;t_2=\frac{${fmt(1/v.v2)}-${fmt(1/v.v1)}}{${fmt(v.c)}}=${fmt(r.t2)}\ \text{s}`}
  ];},
  takeaway:"The velocity function is v(t) = 1 / (1/v₁ + c·t). Speed drops quickly at first and then more slowly, because drag scales with v².",
  plot(v,r){ const pts=[]; const T2=r.t2*1.3; for(let i=0;i<=80;i++){const t=T2*i/80; pts.push([t,1/(1/v.v1+v.c*t)]);} return {xl:"t (s)", yl:"v (m/s)", series:[{pts,label:"v(t)"}], mark:[r.t2,v.v2], cap:"Speed vs. time after the chute opens. The dot marks the target speed v₂."}; }
},

/* ---------- 4. Gas gun: a(s) ---------- */
{
  id:"gasgun", topic:"Particle Kinematics · Cartesian", name:"Gas Gun", tag:"a(s)",
  kind:"Rectilinear motion",
  original:{ s0:1.5, sf:3, vf:200 },
  randomize(){ const s0=pick(0.5,2.0,0.25); return { s0, sf:+(s0+pick(1,3,0.25)).toFixed(2), vf:pick(150,400,10) }; },
  solve(v){ const L=Math.log(v.sf/v.s0), C=v.vf*v.vf/(2*L), af=C/v.sf; return {L,C,af}; },
  statement:(v)=>`In a gas gun, expanding gas accelerates a projectile with a = C/s, where s is its distance from the breech and C is a constant. The projectile starts from rest at s = ${N(v.s0,"m")} and leaves the barrel at s = ${N(v.sf,"m")} with a speed of ${N(v.vf,"m/s")}. Find C and the acceleration at the muzzle.`,
  given:(v)=>[["a(s)","C / s"],["s₀, v₀",`${fmt(v.s0)} m, 0`],["s_f",`${fmt(v.sf)} m`],["v_f",`${fmt(v.vf)} m/s`]],
  find:["Gas constant C","Muzzle acceleration a_f"],
  method:"Acceleration is a function of position, so use the chain rule: a = (dv/dt)(ds/ds) = v dv/ds, giving a ds = v dv. Assume isothermal (constant-temperature) expansion.",
  answers:(v,r)=>[
    {label:"Constant C", unit:"m²/s²", val:r.C},
    {label:"Muzzle acceleration a_f", unit:"m/s²", val:r.af}],
  steps(v,r){ return [
    {t:"Chain rule to remove time", eq:T`a(s)=\frac{dv}{dt}\cdot\frac{ds}{ds}=v\frac{dv}{ds}\;\Rightarrow\;a(s)\,ds=v\,dv`},
    {t:"Substitute a = C/s and integrate", eq:T`C\int_{${fmt(v.s0)}}^{${fmt(v.sf)}}\frac{1}{s}\,ds=\int_0^{${fmt(v.vf)}}v\,dv`},
    {t:"Evaluate", eq:T`C\big[\ln s\big]_{${fmt(v.s0)}}^{${fmt(v.sf)}}=\frac{v^2}{2}\Big|_0^{${fmt(v.vf)}}\;\Rightarrow\;C\ln\!\frac{${fmt(v.sf)}}{${fmt(v.s0)}}=\frac{${fmt(v.vf)}^2}{2}`},
    {t:"Solve for C", eq:T`${fmt(r.L)}\,C=${fmt(v.vf*v.vf/2,6)}\;\Rightarrow\;C=${fmt(r.C)}\ \text{m}^2/\text{s}^2`},
    {t:"Acceleration at the muzzle", eq:T`a_f=\frac{C}{s_f}=\frac{${fmt(r.C)}}{${fmt(v.sf)}}=${fmt(r.af)}\ \text{m/s}^2`}
  ];},
  takeaway:(v,r)=>`That is about ${fmt(r.af/g,3)} g. The acceleration is largest at the breech (s₀) and falls off as the gas expands.`,
  plot(v,r){ const pts=[]; for(let i=0;i<=80;i++){const s=v.s0+(v.sf-v.s0)*i/80; pts.push([s,Math.sqrt(2*r.C*Math.log(s/v.s0))]);} return {xl:"s (m)", yl:"v (m/s)", series:[{pts,label:"v(s)"}], mark:[v.sf,v.vf], xmin:0, cap:"Speed along the barrel, v(s) = √(2C ln(s/s₀)). The dot marks the muzzle."}; }
},

/* ---------- 5. Survey plane drop: projectile ---------- */
{
  id:"survey", topic:"Particle Kinematics · Cartesian", name:"Survey Plane Drop", tag:"2-D projectile",
  kind:"Curvilinear motion (parabolic)",
  original:{ vx:40, h:30 },
  randomize(){ return { vx:pick(25,70,5), h:pick(20,120,5) }; },
  solve(v){ const t=Math.sqrt(2*v.h/g), d=v.vx*t; return {t,d}; },
  statement:(v)=>`A survey plane flies level at ${N(v.h,"m")} above the ground with a constant horizontal speed of ${N(v.vx,"m/s")} and releases a marker. Neglecting air resistance, find the time of fall and the horizontal distance d the marker travels before it hits the ground. Use g = 9.81 m/s².`,

/* Turn plain-text subscripts like a_t, ΣF_n, r_B/A into real subscripts (skips math and inputs). */
function fixSubs(root){
  if(!root) return;
  const skip=(n)=>{ for(let p=n.parentNode;p&&p!==root.parentNode;p=p.parentNode){ const t=p.nodeName; if(t==="svg"||t==="text"||t==="tspan"||t==="MATH"||t==="math"||t==="CODE"||t==="SCRIPT"||t==="STYLE"||t==="TEXTAREA"||t==="SUB"||(p.classList&&(p.classList.contains("eq")||p.classList.contains("ceq")))) return true; } return false; };
  const re=/([^\s_(])_([A-Za-z0-9]+(?:\/[A-Z][A-Za-z]*)?|[θαωρμ∞])/g;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); const nodes=[];
  while(w.nextNode()){ const n=w.currentNode; if(n.nodeValue.indexOf("_")>=0 && !skip(n)) nodes.push(n); }
  nodes.forEach(n=>{ const s=n.nodeValue; const frag=document.createDocumentFragment(); let last=0; s.replace(re,(m,a,b,i)=>{ frag.appendChild(document.createTextNode(s.slice(last,i)+a)); const sb=document.createElement("sub"); sb.textContent=b; frag.appendChild(sb); last=i+m.length; return m; }); frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag,n); });
}

/* ===================== FILL-IN-THE-BLANK TEMPLATES =====================
   A template is MATLAB source with blanks written as {{expr}} or {{expr || hint}}.
   The expr is the reference answer for that blank (also used to check).        */
const MLT=(()=>{
  const RE=/\{\{([\s\S]*?)\}\}/g;
  function parseTemplate(src){
    const blanks=[]; let n=0;
    const lines=src.split("\n");
    const plain=lines.map((ln,li)=>ln.replace(RE,(m,body)=>{ const [ans,hint]=body.split("||").map(s=>s.trim()); blanks.push({i:n,line:li+1,ans,hint:hint||""}); return "\u0000"+(n++)+"\u0000"; }));
    return {lines:plain,blanks};
  }
  const fill=(lines,f)=>lines.map(l=>l.replace(/\u0000(\d+)\u0000/g,(m,i)=>f(+i))).join("\n");
  /* reference run: fill every blank with its answer */
  function reference(tpl){ return fill(tpl.lines,i=>tpl.blanks[i].ans); }
  function student(tpl,vals){ return fill(tpl.lines,i=>(vals[i]||"").trim()||"____"); }
  /* check one blank: evaluate student text in the scope just before that line */
  function checkBlank(tpl,ref,i,text){
    const b=tpl.blanks[i]; const sc=ref.scopes[b.line]; if(!sc) return {ok:false,msg:"reference failed"};
    if(!text.trim()) return {ok:false,msg:"empty"};
    try{ const want=ML.evalIn(b.ans,sc); const got=ML.evalIn(text,sc); if(ML.same(got,want)) return {ok:true}; return {ok:false,msg:"gives "+(ML.isM(got)?"a "+got.r+"×"+got.c+" matrix":ML.fmtG(got))+", expected "+(ML.isM(want)?"a "+want.r+"×"+want.c+" matrix":ML.fmtG(want))}; }
    catch(e){ return {ok:false,msg:e.message}; }
  }
  return {parseTemplate,reference,student,checkBlank,fill};
})();

      case "force": return (unit==="N"||unit==="kN"?"≈ weight of "+Number((si/9.81).toPrecision(2))+" kg · ":"")+ladderText(si,FORCE);

      case "len": return ladderText(si,LEN);
      case "time": return ladderText(si,TIME);
      case "energy": return ladderText(si,ENERGY);
      case "impulse": return ladderText(si,IMPULSE);
      case "torque": return ladderText(si,TORQUE);
      case "inertia": return ladderText(si,INERTIA);
      case "angle": { const deg=unit==="rad"?x*180/Math.PI:x; const rev=deg/360; if(deg<1) return "a hair under 1° — barely a tilt"; if(deg<10) return "a small tilt (a clock's minute hand moves 6° per minute)"; if(deg<80) return Number((deg/90).toPrecision(2))+" of a right angle"; if(deg<100) return "about a right angle (quarter turn)"; if(deg<170) return "between a quarter and a half turn ("+Number(rev.toPrecision(2))+" rev)"; if(deg<190) return "about a half turn"; if(deg<350) return Number(rev.toPrecision(2))+" of a full turn"; return Number(rev.toPrecision(2))+" full revolution"+(rev>=1.5?"s":""); }
    }
    return "";
  }
  function special(val,unit,label){
    const x=Math.abs(val);

    if(/μ|mu|friction/i.test(label)){ if(x<0.05) return "like skates on ice (μ ≈ 0.03)"; if(x<0.15) return "like a wet, oily floor (μ ≈ 0.1)"; if(x<0.35) return "like wood on wood or a dusty floor (μ ≈ 0.3)"; if(x<0.6) return "like rubber on wet pavement (μ ≈ 0.5)"; if(x<0.9) return "like rubber on dry pavement (μ ≈ 0.8)"; return "like racing slicks on hot asphalt (μ ≈ 1)"; }

  }

})();

plane:{
  out:["t2","s2"],
  code:(v,r)=>`% Private plane landing: constant deceleration, find stopping time and runway length
clc; clear;

% ---- Given ----
v_mph = ${v.mph};        % touchdown speed, mph
a     = ${v.a};          % acceleration, ft/s^2 (negative = braking, constant)

% ---- Unit conversion: mph -> ft/s ----
v1 = {{v_mph*5280/3600 || 1 mi = 5280 ft and 1 h = 3600 s.}};      % ft/s

% ---- a = dv/dt with a constant: v(t) = v1 + a*t; stop when v = 0 ----
t2 = {{-v1/a || Set v(t2) = v1 + a*t2 = 0 and solve for t2 (a is negative, so t2 comes out positive).}};       % s

% ---- v = ds/dt: s(t) = v1*t + (1/2) a t^2, evaluate at t2 ----
s2 = {{v1*t2 + 0.5*a*t2^2 || Integrate v(t) = v1 + a*t from 0 to t2 with s(0) = 0.}};       % ft

fprintf('Touchdown speed:  v1 = %.2f ft/s\\n', v1);
fprintf('Stopping time:    t2 = %.3f s\\n', t2);
fprintf('Runway length:    s2 = %.1f ft  (check: %.1f ft)\\n', s2, s2_check);`,

yoke:{

  code:(v,r)=>`% Scotch yoke slider: a(t) = -A sin(k t), integrate twice
clc; clear;

% ---- Given ----
A  = ${v.A};         % amplitude of acceleration, m/s^2
k  = ${v.k};         % angular frequency, rad/s
v0 = ${v.v0};        % velocity at t = 0, m/s
t2 = ${v.t2};        % time of interest, s   (x = 0 at t = 0)

% ---- Integrate a = dv/dt once: v(t) = v0 + (A/k)(cos(k t) - 1) = C + B cos(k t) ----
B = {{A/k || Integral of -A*sin(k*t) dt is (A/k)*cos(k*t); B is that coefficient.}};          % m/s, coefficient of cos(k t)
C = {{v0 - B || Apply v(0) = v0: v0 = C + B*cos(0), so C = v0 - B.}};          % m/s, constant term
v2 = {{C + B*cos(k*t2) || Evaluate v(t) = C + B*cos(k*t) at t2 (k*t2 is in radians).}};  % m/s

% ---- Integrate v = dx/dt: x(t) = C t + (B/k) sin(k t), with x(0) = 0 ----
x2 = {{C*t2 + (B/k)*sin(k*t2) || Integrate C + B*cos(k*t) from 0 to t2; the sine coefficient is B/k = A/k^2.}};  % m

fprintf('v as a function of t:  %.4f + %.4f cos(%g t) m/s\\n', C, B, k);
fprintf('x as a function of t:  %.4f t + %.4f sin(%g t) m\\n', C, B/k, k);
fprintf('At t = %g s:  v = %.4f m/s,  x = %.4f m\\n', t2, v2, x2);`,
  hints:(v,r)=>[

chute:{
  out:["t2"],
  code:(v,r)=>`% Parachute: a(v) = -c v^2, find the time to slow from v1 to v2
clc; clear;

% ---- Given ----
c  = ${v.c};         % drag constant, 1/m   (a = -c v^2 in m/s^2 when v is in m/s)
v1 = ${v.v1};        % speed when the chute opens (t = 0), m/s
v2 = ${v.v2};        % target speed, m/s

% ---- a = dv/dt with a = a(v): move v to the dv side ----
%   -c dt = dv / v^2   ->   -c t = [-1/v] from v1 to v
a1 = {{-c*v1^2 || Plug v1 into a = -c*v^2 to see how hard the braking is at first.}};     % m/s^2, deceleration at the instant the chute opens

% ---- Integrate v^-2 dv from v1 to v2 (power rule: -1/v) ----
I_v = {{-1/v2 + 1/v1 || Integral of v^-2 dv is -1/v; evaluate from v1 to v2.}};    % s/m

% ---- Solve -c t2 = I_v for t2 ----
t2 = {{-I_v/c || -c*t2 equals the integral, so t2 = -I_v/c.}};        % s

% ---- Check: v(t) = 1/(1/v1 + c t) ----
v_check = {{1/(1/v1 + c*t2) || Invert -c t = -1/v + 1/v1 for v(t) and evaluate at t2.}};   % m/s, should equal v2

fprintf('Initial deceleration: a = %.3f m/s^2\\n', a1);
fprintf('Time to slow to %g m/s:  t2 = %.3f s\\n', v2, t2);
fprintf('Check: v at t2 is %.3f m/s\\n', v_check);`,

gasgun:{
  out:["C","a_f"],
  code:(v,r)=>`% Gas gun: a(s) = C/s, find C and the muzzle acceleration
clc; clear;

% ---- Given ----
s0 = ${v.s0};        % starting position from the breech, m (starts from rest)
sf = ${v.sf};        % muzzle position, m
vf = ${v.vf};        % muzzle speed, m/s

% ---- a = a(s): chain rule  a = v dv/ds  ->  a ds = v dv ----
%   C * integral(1/s ds, s0..sf) = integral(v dv, 0..vf)
L = {{log(sf/s0) || Integral of 1/s ds from s0 to sf is ln(sf) - ln(s0) = ln(sf/s0). In MATLAB, log() is the natural log.}};      % dimensionless, ln(sf/s0)
KE = {{vf^2/2 || Integral of v dv from 0 to vf is vf^2/2.}};      % m^2/s^2, right-hand side

% ---- Solve for C ----
C = {{KE/L || C*L = vf^2/2, so C = (vf^2/2)/L.}};          % m^2/s^2

% ---- Acceleration at the breech (start) and at the muzzle ----
a_0 = {{C/s0 || a = C/s at s = s0 (the largest acceleration).}};        % m/s^2
a_f = {{C/sf || a = C/s at the muzzle, s = sf.}};        % m/s^2

fprintf('Acceleration at s0:  a_0 = %.4g m/s^2\\n', a_0);

vtgraph:{
  out:["a1","a3","d","v_avg"],
  code:(v,r)=>`% Tram with a trapezoidal v-t graph: accelerations from slopes, distance from area
clc; clear;

% ---- Given ----
v_max = ${v.vmax};       % cruising speed, m/s
t1    = ${v.t1};         % end of the speed-up phase, s
t2    = ${v.t2};         % start of braking, s
t3    = ${v.t3};         % tram stopped, s

% ---- Accelerations = slopes of the v-t graph ----
a1 = {{v_max/t1 || Slope of the first segment: rise v_max over run t1 (from rest).}};             % m/s^2, phase 1 (0 to t1)
a2 = 0;                       % m/s^2, phase 2: constant speed, so zero slope
a3 = {{-v_max/(t3 - t2) || Slope of the last segment: the speed drops from v_max to 0 over t3 - t2, so it is negative.}};      % m/s^2, phase 3 (t2 to t3)

% ---- Distances = areas under the v-t graph ----
d1 = {{0.5*v_max*t1 || Triangle: half base times height.}};             % m, triangle
d2 = {{v_max*(t2 - t1) || Rectangle: speed times the cruising time.}};      % m, rectangle
d3 = {{0.5*v_max*(t3 - t2) || Triangle again, base t3 - t2.}};      % m, triangle
d  = d1 + d2 + d3;            % m, total distance between stops

% ---- Average speed = total distance / total time ----
v_avg = {{d/t3 || Average speed is the whole distance divided by the whole time t3, not the average of the phase speeds.}};                 % m/s

fprintf('Accelerations: a1 = %.3f, a2 = %.3f, a3 = %.3f m/s^2\\n', a1, a2, a3);
fprintf('Areas: d1 = %.1f m, d2 = %.1f m, d3 = %.1f m\\n', d1, d2, d3);

rampjump:{
  out:["t_fl","d"],
  code:(v,r)=>`% Motorcycle ramp jump: projectile launched from a height, quadratic in t
clc; clear;

% ---- Given ----
h     = ${v.h};          % ramp height above the ground, m
v0    = ${v.v0};         % launch speed, m/s
th    = deg2rad(${v.th});  % launch angle above horizontal, rad
g     = 9.81;            % m/s^2

% ---- Initial velocity components ----
v0x = {{v0*cos(th) || Horizontal component of the launch velocity.}};        % m/s
v0y = {{v0*sin(th) || Vertical component of the launch velocity.}};        % m/s

% ---- j equation: y(t) = h + v0y t - (1/2) g t^2 = 0 at landing ----
%   Written as a polynomial in t: (-g/2) t^2 + v0y t + h = 0
tt = {{roots([-g/2, v0y, h]) || roots() takes the polynomial coefficients from highest power down: -g/2, v0y, h.}};     % s, both roots of the quadratic
t_fl = max(tt);           % s, the positive root is the physical one (the negative root is before the jump)

% ---- i equation: no horizontal acceleration ----
d = {{v0x*t_fl || x = v0x * t with the flight time just found.}};             % m

% ---- Bonus: peak of the jump (v_y = 0) ----
t_pk  = {{v0y/g || Set v_y = v0y - g t = 0.}};             % s
y_max = {{h + v0y^2/(2*g) || Start at h and add the rise v0y^2/(2g).}};       % m

fprintf('v0 = (%.3f i + %.3f j) m/s\\n', v0x, v0y);
fprintf('Roots of the landing equation: %.3f s and %.3f s -> use %.3f s\\n', tt(1), tt(2), t_fl);
fprintf('Time of flight:      t = %.3f s\\n', t_fl);
fprintf('Horizontal distance: d = %.2f m\\n', d);
fprintf('Peak height %.2f m at t = %.3f s\\n', y_max, t_pk);`,

    "Key equations: y(t) = h + v₀ sin θ·t − ½gt² = 0 → t = [v₀ sin θ + √((v₀ sin θ)² + 2gh)]/g; d = v₀ cos θ·t.",

  sense:(v,r)=>[null, `about ${fmt(r.d/4.5,2)} parked cars end to end`],
},

fieldgoal:{

  code:(v,r)=>`% Field goal: height of the ball at the goalposts, clearance over the crossbar, speed there
clc; clear;

% ---- Given ----
v0  = ${v.v0};           % kick speed, m/s
th  = deg2rad(${v.th});  % kick angle above horizontal, rad
x_c = ${v.xc};           % distance to the goalposts, m
y_bar = ${v.yc};         % crossbar height, m
g   = 9.81;              % m/s^2

% ---- Initial velocity components ----
v0x = v0*cos(th);        % m/s
v0y = v0*sin(th);        % m/s

% ---- i equation (no horizontal acceleration): time to reach the posts ----
t_c = {{x_c/v0x || x = v0x * t, so t = x_c / v0x.}};          % s

% ---- j equation: height and vertical velocity at that time ----
y_c = {{v0y*t_c - 0.5*g*t_c^2 || y(t) = v0y t - (1/2) g t^2 from y(0) = 0.}};        % m, height of the ball at x_c
v_y = {{v0y - g*t_c || v_y(t) = v0y - g t.}};        % m/s, vertical velocity at x_c (negative = coming down)

% ---- Clearance over the crossbar (negative = misses) ----
clr = {{y_c - y_bar || Ball height minus crossbar height.}};          % m

% ---- Speed at the posts ----
speed = {{sqrt(v0x^2 + v_y^2) || v_x is unchanged; combine it with v_y.}};      % m/s

fprintf('Time to reach the posts: t = %.3f s\\n', t_c);
fprintf('Ball height at x_c:      y = %.3f m  (crossbar at %.2f m)\\n', y_c, y_bar);
fprintf('Clearance:               %.3f m  (negative = misses)\\n', clr);
fprintf('Velocity there: (%.2f i %+.2f j) m/s, |v| = %.2f m/s\\n', v0x, v_y, speed);`,
  hints:(v,r)=>[
    "Use the horizontal motion as a clock: x = v₀ₓt has no acceleration, so the distance to the posts fixes the time. Substitute that time into the vertical position and velocity equations. Clearance is simply ball height minus bar height; the sign tells you whether it is good.",
    "Key equations: t_c = x_c/(v₀ cos θ); y = v₀ sin θ·t_c − ½gt_c²; v_y = v₀ sin θ − g t_c; |v| = √(v₀ₓ² + v_y²).",
    `v₀ₓ = ${fmt(v.v0)} cos ${fmt(v.th)}° = ${fmt(r.vx)} m/s, v₀y = ${fmt(r.vy0)} m/s, so t_c = ${fmt(v.xc)}/${fmt(r.vx)} = ${fmt(r.tc)} s. Then y = ${fmt(r.vy0)}(${fmt(r.tc)}) − 4.905(${fmt(r.tc)})², and subtract ${fmt(v.yc)} m.`],
  sense:(v,r)=>[null, r.clr>=0?`good: clears the bar by about ${fmt(r.clr/0.28,2)} football lengths`:`no good: ${fmt(-r.clr,2)} m below the bar`, null],
},

pulley:{
  out:["v_B","a_B","dy_B"],
  code:(v,r)=>`% Dependent motion: block A on a table, rope over a fixed pulley to a movable pulley carrying B
clc; clear;

% ---- Given ----
v_A = ${v.vA};           % m/s, A moves right (toward the pulley)
a_A = ${v.aA};           % m/s^2, A speeding up in the same direction
t   = ${v.t};            % s

% ---- Constraint: rope length L = (D - x_A) + 2*y_B + const, with x_A to the right, y_B down ----
%   Differentiating: 0 = -x_A_dot + 2*y_B_dot  ->  y_B_dot = x_A_dot / 2
n_seg = 2;               % rope segments supporting the movable pulley

% ---- Velocity and acceleration of B (positive = downward) ----
v_B = {{v_A/n_seg || From 0 = -v_A + 2 v_B: B moves at half the speed of A.}};          % m/s
a_B = {{a_A/n_seg || Differentiate the velocity constraint once more.}};          % m/s^2

% ---- Displacements over time t (constant acceleration) ----
dx_A = {{v_A*t + 0.5*a_A*t^2 || Constant-acceleration displacement of A.}};    % m
dy_B = {{dx_A/n_seg || The position constraint holds too: B moves half as far as A.}};             % m

fprintf('Constraint: x_A - 2 y_B = const  ->  v_B = v_A/2, a_B = a_A/2\\n');
fprintf('v_B = %.3f m/s (down), a_B = %.3f m/s^2 (down)\\n', v_B, a_B);
fprintf('In %g s: A moves %.3f m, B drops %.3f m\\n', t, dx_A, dy_B);`,

  const esc=(s)=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function hl(code){ /* tiny MATLAB highlighter for one code fragment (no blanks inside) */
    let out="", i=0; const n=code.length;
    while(i<n){
      const c=code[i];
      if(c==="%"){ out+=`<span class="c">${esc(code.slice(i))}</span>`; break; }
      if(c==="'"){ const prev=code[i-1]||" "; if(!/[\w)\]']/.test(prev)){ let j=i+1; while(j<n&&code[j]!=="'") j++; out+=`<span class="s">${esc(code.slice(i,j+1))}</span>`; i=j+1; continue; } }
      if(/[0-9]/.test(c)||(c==="."&&/[0-9]/.test(code[i+1]||""))){ let j=i; while(j<n&&/[0-9.eE]/.test(code[j])&&!(/[eE]/.test(code[j])&&!/[0-9+\-]/.test(code[j+1]||""))) j++; if(/[eE]/.test(code[j-1])) j--; if(/[+\-]/.test(code[j])&&/[eE]/.test(code[j-1])&&/[0-9]/.test(code[j+1]||"")){ j++; while(j<n&&/[0-9]/.test(code[j])) j++; } out+=`<span class="n">${esc(code.slice(i,j))}</span>`; i=j; continue; }
      if(/[A-Za-z_]/.test(c)){ let j=i; while(j<n&&/[A-Za-z0-9_]/.test(code[j])) j++; const w=code.slice(i,j); const k=/^(clc|clear|fprintf|disp|end|pi)$/.test(w)?"k":/^(sqrt|abs|exp|log|log10|sin|cos|tan|asin|acos|atan|atan2|sind|cosd|tand|deg2rad|rad2deg|cross|dot|norm|sum|max|min|roots|hypot|zeros|ones|eye|inv|det|linspace|num2str|floor|ceil|round|sign|mod)$/.test(w)?"f":""; out+=k?`<span class="${k}">${w}</span>`:esc(w); i=j; continue; }
      out+=esc(c); i++;

  }

    host.innerHTML=`<details class="mlab" ${m.open?"open":""}>
      <summary><span class="mlt">MATLAB</span> Fill in the ${tpl.blanks.length} blanks <span class="mlsub">· same numbers as above · +15 XP</span></summary>
      <div class="mlbody">
        <p class="mlhelp">Write each blank as a MATLAB expression using the variables already defined above it (for example <code>0.5*m*v^2</code> or <code>cross(omega, r_BA)</code>). Press <b>?</b> next to a blank for a hint, then <b>Check blanks</b>. <b>Run</b> executes the script right here and shows what MATLAB would print.</p>

}

function select(id){
  state.id=id; state.vars={...cur().original}; state.isOriginal=true; state.shown=0; state.variant=1;
  try{ localStorage.setItem("dpl-last-Particle_Kinematics_Cartesian.html", id); }catch(e){}
  renderNav(); renderSheet(); window.scrollTo({top:0});
}
function fresh(){ state.vars=cur().randomize(); state.isOriginal=false; state.shown=0; state.variant++; renderSheet(); }
function original(){ state.vars={...cur().original}; state.isOriginal=true; state.shown=0; renderSheet(); }

function renderSheet(){
  const p=cur(), v=state.vars, r=p.solve(v), ans=p.answers(v,r);
  const steps=p.steps(v,r);
  $("#sheet").innerHTML = `
    <div class="phead">
      <div><div class="eyebrow">${p.kind} · ${p.tag}</div><h2>${p.name}</h2></div>
      <div class="controls">
        <button class="btn primary" id="new" type="button">New numbers</button>
        <button class="btn" id="orig" type="button">Class example</button>
      </div>
    </div>
    <div class="variant">${state.isOriginal ? "Showing the numbers from the class notes" : "Practice version #"+(state.variant-1)+" · random givens"}</div>
    <div class="probtop"><p class="statement">${p.statement(v,r)}</p>${(typeof DIAG!=="undefined"&&DIAG[p.id])?`<figure class="schem">${DIAG[p.id](v,r)}<figcaption>Schematic · updates with the numbers</figcaption></figure>`:""}</div>
    <div class="cols">
      <div class="box"><h3>Given</h3><ul>${p.given(v,r).map(([k,x])=>`<li><span>${k}</span><span class="v">${x}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Find</h3><ul>${p.find.map(f=>`<li><span>${f}</span></li>`).join("")}</ul></div>
    </div>
    <p class="method"><b>Method.</b> ${p.method}</p>

    <form class="answers" id="ansform" autocomplete="off">
      <h3>Your answers</h3>
      ${ans.map((a,i)=>`<div class="arow">
        <label for="a${i}">${a.label}</label>
        <div class="inp"><input id="a${i}" inputmode="decimal" placeholder="e.g. 12.3"><span class="unit">${a.unit}</span></div>
        <span class="chip idle" id="c${i}">not checked</span><div class="sense" id="s${i}" hidden></div></div>`).join("")}
      <div class="checkbar">
        <button class="btn primary" type="submit">Check answers</button>
        <button class="btn" type="button" id="next">Show next step</button>
        <button class="btn" type="button" id="all">Show full solution</button>
        <button class="btn" type="button" id="hintbtn">Hint</button>
        <span class="hint">Correct within 1%.</span>
      </div>
      <div class="hints" id="hints" hidden></div>
    </form>
    <section id="mlab"></section>
    <section id="sol" class="solution" ${state.shown?"":"hidden"}></section>`;

  $("#new").onclick=fresh; $("#orig").onclick=original;
  $("#next").onclick=()=>{ state.shown=Math.min(state.shown+1, steps.length); drawSolution(p,v,r,ans,steps); };
  $("#all").onclick=()=>{ state.shown=steps.length; drawSolution(p,v,r,ans,steps); };
  $("#ansform").onsubmit=(e)=>{ e.preventDefault(); ans.forEach((a,i)=>check(a,i)); GAME.onCheck(ans); };
  if(state.shown) drawSolution(p,v,r,ans,steps);
  document.querySelectorAll(".schem svg").forEach(el=>D.tidy(el));
  fixSubs($("#sheet"));
  MLAB.render(p,v,r); HINTS.render(p,v,r);
}

function check(a,i){
  const raw=$("#a"+i).value.trim().replace(/,/g,""), chip=$("#c"+i);
  if(raw===""){ chip.className="chip idle"; chip.textContent="enter a value"; return; }
  const x=parseFloat(raw);
  if(isNaN(x)){ chip.className="chip bad"; chip.textContent="not a number"; return; }
  const err=Math.abs(x-a.val)/Math.max(Math.abs(a.val),1e-9);
  if(err<=0.01){ chip.className="chip good"; chip.textContent="correct"; SENSE_UI.show(cur(),state.vars,cur().solve(state.vars),i,a); }
  else if(err<=0.05){ chip.className="chip warn"; chip.textContent="close, check rounding"; }
  else if(Math.abs(x+a.val)/Math.max(Math.abs(a.val),1e-9)<=0.01){ chip.className="chip warn"; chip.textContent="check the sign"; }
  else { chip.className="chip bad"; chip.textContent="not yet"; }
}

function drawSolution(p,v,r,ans,steps){
  const sol=$("#sol"); sol.hidden=false;
  const done = state.shown>=steps.length;
  const tk = typeof p.takeaway==="function" ? p.takeaway(v,r) : p.takeaway;
  sol.innerHTML = `<h3>Worked solution</h3>
    <ol class="steps">${steps.slice(0,state.shown).map(s=>`<li><span class="step-title">${s.t}</span><div class="step-body"><div class="eq">${tex(s.eq)}</div>${s.note?`<p class="note">${s.note}</p>`:""}</div></li>`).join("")}</ol>
    ${done ? `
      <div class="final">${ans.map((a,i)=>`<div class="ans"><div class="k">${a.label}</div><div class="val">${fmt(a.val)} ${a.unit}</div>${(m=>m?`<div class="mean"><span class="sk">Means</span>${m}</div>`:"")(meaningOf(p,v,r,i,a))}</div>`).join("")}</div>
      <p class="takeaway"><b>Takeaway.</b> ${tk}</p>
      <figure class="plotwrap" style="margin:0"><figcaption id="cap"></figcaption><canvas id="plot"></canvas></figure>`
      : `<p class="note">Step ${state.shown} of ${steps.length}. Try the next step yourself before revealing it.</p>`}`;
  if(done) drawPlot(p.plot(v,r));
  fixSubs(sol);
}

function drawPlot(P){
  const cv=$("#plot"); if(!cv) return; $("#cap").textContent=P.cap; fixSubs($("#cap"));
  const css=getComputedStyle(document.documentElement), col=(n)=>css.getPropertyValue(n).trim();
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const all=P.series.flatMap(s=>s.pts);
  let x0=P.xmin??Math.min(0,...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0]));
  let y0=Math.min(0,...all.map(p=>p[1])), y1=Math.max(...all.map(p=>p[1]));
  const padY=(y1-y0)*0.08||1; y1+=padY; if(y0<0) y0-=padY;
  const L=58,R=16,Tp=12,B=40, pw=W-L-R, ph=H-Tp-B;
  let sx=pw/(x1-x0), sy=ph/(y1-y0);
  if(P.equal){ const s=Math.min(sx,sy); sx=sy=s; const cx=(x0+x1)/2, cy=(y0+y1)/2; x0=cx-pw/(2*s); y0=cy-ph/(2*s); }
  const X=(x)=>L+(x-x0)*sx, Y=(y)=>Tp+ph-(y-y0)*sy;
  const nice=(span)=>{const r=span/5, m=Math.pow(10,Math.floor(Math.log10(r))), f=r/m; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*m;};
  c.font="12px "+col("--mono"); c.lineWidth=1;
  const xs=nice(P.equal?(pw/sx):(x1-x0)), ys=nice(P.equal?(ph/sy):(y1-y0));
  const xEnd=x0+pw/sx, yEnd=y0+ph/sy;
  c.strokeStyle=col("--line"); c.fillStyle=col("--muted");
  c.textAlign="center"; c.textBaseline="top";
  for(let x=Math.ceil(x0/xs)*xs; x<=xEnd+1e-9; x+=xs){ c.beginPath(); c.moveTo(X(x),Tp); c.lineTo(X(x),Tp+ph); c.stroke(); c.fillText(fmt(x,3),X(x),Tp+ph+6); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let y=Math.ceil(y0/ys)*ys; y<=yEnd+1e-9; y+=ys){ c.beginPath(); c.moveTo(L,Y(y)); c.lineTo(L+pw,Y(y)); c.stroke(); c.fillText(fmt(y,3),L-6,Y(y)); }
  c.strokeStyle=col("--muted"); c.beginPath(); c.moveTo(L,Y(Math.max(0,y0))); c.lineTo(L+pw,Y(Math.max(0,y0))); c.moveTo(L,Tp); c.lineTo(L,Tp+ph); c.stroke();
  c.fillStyle=col("--muted"); c.textAlign="right"; c.textBaseline="bottom"; c.fillText(P.xl,L+pw,H-2);
  c.save(); c.translate(12,Tp+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.textBaseline="middle"; c.fillText(P.yl,0,0); c.restore();
  P.series.forEach(s=>{ c.strokeStyle=s.alt?col("--plot-2"):col("--accent"); c.lineWidth=2.5; c.shadowColor=c.strokeStyle; c.shadowBlur=10; c.beginPath(); s.pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))); c.stroke(); });
  c.shadowBlur=0;
  const dot=(m,color)=>{ c.fillStyle=color; c.strokeStyle=col("--surface-2"); c.lineWidth=2; c.beginPath(); c.arc(X(m[0]),Y(m[1]),5,0,7); c.fill(); c.stroke(); };
  if(P.mark) dot(P.mark,col("--accent")); if(P.mark2) dot(P.mark2,col("--plot-2"));
}

window.addEventListener("resize",()=>{ if(state.shown && !$("#sol").hidden){ const p=cur(), v=state.vars, r=p.solve(v); if(state.shown>=p.steps(v,r).length) drawPlot(p.plot(v,r)); }});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>window.dispatchEvent(new Event("resize")));

let start=PROBLEMS[0].id; try{ const s=localStorage.getItem("dpl-last-Particle_Kinematics_Cartesian.html"); if(s && PROBLEMS.some(p=>p.id===s)) start=s; }catch(e){}
try{ const hh=decodeURIComponent(location.hash.slice(1)); if(hh&&PROBLEMS.some(p=>p.id===hh)) start=hh; }catch(e){}
state.id=start; state.vars={...cur().original};
renderNav(); renderSheet(); GAME.hud();
</script>
</body></html>
