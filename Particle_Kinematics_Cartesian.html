<script>
/* =====================================================================
   HELPERS
   ===================================================================== */
const T = String.raw;
const g = 9.81;
function pick(min, max, step){ const n = Math.round((max-min)/step); return +(min + step*Math.floor(Math.random()*(n+1))).toFixed(6); }
function fmt(x, sig=4){ if(!isFinite(x)) return "—"; if(Math.abs(x) < 1e-12) return "0"; return String(Number(x.toPrecision(sig))); }
function sgn(x, sig=4){ return (x < 0 ? " - " : " + ") + fmt(Math.abs(x), sig); }   // signed term for equations
function tex(s, display=true){
  if(window.katex){ try{ return katex.renderToString(s,{output:"mathml",displayMode:display,throwOnError:false}); }catch(e){} }
  return '<code>'+s.replace(/</g,"&lt;")+'</code>';
}
function N(x, unit="", sig=4){ return `<span class="num">${fmt(x,sig)}${unit?"&nbsp;"+unit:""}</span>`; }

/* =====================================================================
   PROBLEM BANK
   To add a problem, copy one object below and edit:
     id, topic, name, tag, original (the numbers from your notes),
     randomize() -> new givens, solve(v) -> computed values,
     statement, given, find, method, answers, steps, plot, takeaway
   ===================================================================== */
const PROBLEMS = [

/* ---------- 1. Private plane: constant acceleration ---------- */
{
  id:"plane", topic:"Particle Kinematics · Cartesian", name:"Private Plane", tag:"a = const",
  kind:"Rectilinear motion",
  original:{ mph:60, a:-10 },
  randomize(){ return { mph:pick(45,95,5), a:-pick(6,16,1) }; },
  solve(v){ const v1=v.mph*5280/3600, t2=v1/(-v.a), s2=v1*v1/(-2*v.a); return {v1,t2,s2}; },
  statement:(v)=>`A small private plane touches down at ${N(v.mph,"mph")} and brakes with a constant deceleration of ${N(-v.a,"ft/s²")}. Find how long it takes to stop and the minimum runway length required.`,
  given:(v,r)=>[["v₁",`${fmt(v.mph)} mph`],["a",`${fmt(v.a)} ft/s² (constant)`],["t₁, s₁",`0, 0`],["v₂","0 (stopped)"]],
  find:["Stopping time t₂","Runway length s₂"],
  method:"Kinematic relations, 4-step procedure: a = dv/dt, separate variables, integrate, solve. Then repeat with v = ds/dt.",
  answers:(v,r)=>[
    {label:"Stopping time t₂", unit:"s", val:r.t2},
    {label:"Runway length s₂", unit:"ft", val:r.s2}],
  steps(v,r){ const A=-v.a; return [
    {t:"Convert the landing speed to ft/s", eq:T`v_1=${fmt(v.mph)}\,\tfrac{\text{mi}}{\text{h}}\cdot\tfrac{5280\ \text{ft}}{1\ \text{mi}}\cdot\tfrac{1\ \text{h}}{3600\ \text{s}}=${fmt(r.v1)}\ \text{ft/s}`},
    {t:"Kinematic relation and separate variables", eq:T`a=\frac{dv}{dt}\;\Rightarrow\;a\,dt=dv`},
    {t:"Integrate from the initial state", eq:T`\int_0^{t}(-${fmt(A)})\,dt=\int_{${fmt(r.v1)}}^{v}dv\;\Rightarrow\;v(t)=${fmt(r.v1)}-${fmt(A)}t`,
      note:"Plug in only the initial state so the result is a velocity function."},
    {t:"State 2: the plane stops (v = 0)", eq:T`0=${fmt(r.v1)}-${fmt(A)}t_2\;\Rightarrow\;t_2=\frac{${fmt(r.v1)}}{${fmt(A)}}=${fmt(r.t2)}\ \text{s}`},
    {t:"Repeat for position with v = ds/dt", eq:T`\int_0^{t}(${fmt(r.v1)}-${fmt(A)}t)\,dt=\int_0^{s}ds\;\Rightarrow\;s(t)=${fmt(r.v1)}t-${fmt(A/2)}t^2`},
    {t:"Evaluate at t₂", eq:T`s_2=${fmt(r.v1)}(${fmt(r.t2)})-${fmt(A/2)}(${fmt(r.t2)})^2=${fmt(r.s2)}\ \text{ft}`},
    {t:"Check with the constant-acceleration equation", eq:T`v_2^2=v_1^2+2a\,\Delta s\;\Rightarrow\;0=${fmt(r.v1)}^2+2(-${fmt(A)})s_2\;\Rightarrow\;s_2=${fmt(r.s2)}\ \text{ft}\ \checkmark`}
  ];},
  takeaway:"This is the minimum runway length. Because a is constant, the 4-step procedure and the constant-acceleration equations give the same answer.",
  plot(v,r){ const pts=[]; for(let i=0;i<=60;i++){const t=r.t2*i/60; pts.push([t, r.v1*t+0.5*v.a*t*t]);} return {xl:"t (s)", yl:"s (ft)", series:[{pts,label:"s(t)"}], mark:[r.t2,r.s2], cap:"Position vs. time. The curve flattens as the plane slows; the dot marks the stop."}; }
},

/* ---------- 2. Scotch yoke: a(t) ---------- */
{
  id:"yoke", topic:"Particle Kinematics · Cartesian", name:"Scotch Yoke", tag:"a(t)",
  kind:"Linear motion",
  original:{ A:1.8, k:3, v0:0.6, t2:0.5 },
  randomize(){ return { A:pick(1.2,3.0,0.1), k:pick(2,5,0.5), v0:pick(0.3,1.0,0.1), t2:pick(0.2,1.0,0.1) }; },
  solve(v){ const B=v.A/v.k, C=v.v0-B, kt=v.k*v.t2; const v2=C+B*Math.cos(kt), x2=C*v.t2+(v.A/(v.k*v.k))*Math.sin(kt); return {B,C,kt,v2,x2}; },
  statement:(v)=>`The slider A of a Scotch yoke mechanism has acceleration a = −${N(v.A)} sin(${N(v.k)} t) m/s², with t in seconds. At t = 0 it is at x = 0 moving with v = ${N(v.v0,"m/s")}. Find its velocity and position at t = ${N(v.t2,"s")}.`,
  given:(v)=>[["a(t)",`−${fmt(v.A)} sin(${fmt(v.k)}t) m/s²`],["x₁, t₁","0, 0"],["v₁",`${fmt(v.v0)} m/s`],["t₂",`${fmt(v.t2)} s`]],
  find:["Velocity v(t₂)","Position x(t₂)"],
  method:"Acceleration is a function of time, so integrate a = dv/dt directly, then v = dx/dt. Angles are in radians.",
  answers:(v,r)=>[
    {label:"Velocity v(t₂)", unit:"m/s", val:r.v2},
    {label:"Position x(t₂)", unit:"m", val:r.x2}],
  steps(v,r){ const K2=v.A/(v.k*v.k); return [
    {t:"Kinematic relation, separate, integrate", eq:T`a=\frac{dv}{dt}\;\Rightarrow\;\int_{${fmt(v.v0)}}^{v}dv=-${fmt(v.A)}\int_0^{t}\sin(${fmt(v.k)}t)\,dt`},
    {t:"Evaluate the integral", eq:T`v-${fmt(v.v0)}=\frac{${fmt(v.A)}}{${fmt(v.k)}}\big[\cos(${fmt(v.k)}t)-1\big]`},
    {t:"Velocity function", eq:T`v(t)=${fmt(r.C)}${sgn(r.B)}\cos(${fmt(v.k)}t)\ \text{m/s}`,
      note: Math.abs(r.C)<1e-9 ? "Here v₁ equals A/k, so the constant term cancels (same as in the original example)." : `The constant term is v₁ − A/k = ${fmt(v.v0)} − ${fmt(r.B)} = ${fmt(r.C)}. In the original example this was zero because v₁ = A/k.`},
    {t:"Velocity at t₂ (radians!)", eq:T`v(${fmt(v.t2)})=${fmt(r.C)}${sgn(r.B)}\cos(${fmt(r.kt)})=${fmt(r.v2,3)}\ \text{m/s}`},
    {t:"Repeat with v = dx/dt", eq:T`\int_0^{t}\Big(${fmt(r.C)}${sgn(r.B)}\cos(${fmt(v.k)}t)\Big)dt=\int_0^{x}dx\;\Rightarrow\;x(t)=${fmt(r.C)}\,t${sgn(K2)}\sin(${fmt(v.k)}t)`,
      note:`The sine coefficient is A/k² = ${fmt(v.A)}/${fmt(v.k)}² = ${fmt(K2)}.`},
    {t:"Position at t₂", eq:T`x(${fmt(v.t2)})=${fmt(r.C)}(${fmt(v.t2)})${sgn(K2)}\sin(${fmt(r.kt)})=${fmt(r.x2,3)}\ \text{m}`}
  ];},
  takeaway:"Set your calculator to radians: k·t is an angle in radians. With a = a(t), no chain rule is needed.",
  plot(v,r){ const T2=Math.max(v.t2*1.6, 2*Math.PI/v.k); const p1=[],p2=[]; for(let i=0;i<=120;i++){const t=T2*i/120; p1.push([t,r.C+r.B*Math.cos(v.k*t)]); p2.push([t,r.C*t+(v.A/(v.k*v.k))*Math.sin(v.k*t)]);} return {xl:"t (s)", yl:"v (m/s), x (m)", series:[{pts:p1,label:"v(t)"},{pts:p2,label:"x(t)",alt:true}], mark:[v.t2,r.v2], mark2:[v.t2,r.x2], cap:"Velocity (blue) and position (orange) over one full cycle. Dots mark t₂."}; }
},

/* ---------- 3. Parachute: a(v) ---------- */
{
  id:"chute", topic:"Particle Kinematics · Cartesian", name:"Parachute", tag:"a(v)",
  kind:"Rectilinear motion",
  original:{ c:0.004, v1:50, v2:10 },
  randomize(){ return { c:pick(0.002,0.008,0.001), v1:pick(35,75,5), v2:pick(6,20,1) }; },
  solve(v){ const t2=(1/v.v2-1/v.v1)/v.c; return {t2}; },
  statement:(v)=>`When a parachute opens, the jumper's deceleration depends on speed: a = −${N(v.c)} v² m/s² (v in m/s). The chute opens at t = 0 when v = ${N(v.v1,"m/s")}. How long until the jumper slows to ${N(v.v2,"m/s")}?`,
  given:(v)=>[["a(v)",`−${fmt(v.c)} v² m/s²`],["t₁","0"],["v₁",`${fmt(v.v1)} m/s`],["v₂",`${fmt(v.v2)} m/s`]],
  find:["Time t₂"],
  method:"Acceleration is a function of velocity: use a = dv/dt, move v to the dv side, then integrate.",
  answers:(v,r)=>[{label:"Time t₂", unit:"s", val:r.t2}],
  steps(v,r){ return [
    {t:"Kinematic relation with a(v)", eq:T`a(v)=\frac{dv}{dt}\;\Rightarrow\;-${fmt(v.c)}\,v^2=\frac{dv}{dt}`},
    {t:"Separate variables and integrate", eq:T`-${fmt(v.c)}\int_0^{t}dt=\int_{${fmt(v.v1)}}^{v}\frac{1}{v^2}\,dv`,
      note:"Power rule: ∫v⁻² dv = v⁻¹/(−1) = −1/v."},
    {t:"Evaluate", eq:T`-${fmt(v.c)}\,t=-\frac{1}{v}+\frac{1}{${fmt(v.v1)}}`},
    {t:"Plug in state 2 and solve", eq:T`-${fmt(v.c)}\,t_2=-\frac{1}{${fmt(v.v2)}}+\frac{1}{${fmt(v.v1)}}\;\Rightarrow\;t_2=\frac{${fmt(1/v.v2)}-${fmt(1/v.v1)}}{${fmt(v.c)}}=${fmt(r.t2)}\ \text{s}`}
  ];},
  takeaway:"The velocity function is v(t) = 1 / (1/v₁ + c·t). Speed drops quickly at first and then more slowly, because drag scales with v².",
  plot(v,r){ const pts=[]; const T2=r.t2*1.3; for(let i=0;i<=80;i++){const t=T2*i/80; pts.push([t,1/(1/v.v1+v.c*t)]);} return {xl:"t (s)", yl:"v (m/s)", series:[{pts,label:"v(t)"}], mark:[r.t2,v.v2], cap:"Speed vs. time after the chute opens. The dot marks the target speed v₂."}; }
},

/* ---------- 4. Gas gun: a(s) ---------- */
{
  id:"gasgun", topic:"Particle Kinematics · Cartesian", name:"Gas Gun", tag:"a(s)",
  kind:"Rectilinear motion",
  original:{ s0:1.5, sf:3, vf:200 },
  randomize(){ const s0=pick(0.5,2.0,0.25); return { s0, sf:+(s0+pick(1,3,0.25)).toFixed(2), vf:pick(150,400,10) }; },
  solve(v){ const L=Math.log(v.sf/v.s0), C=v.vf*v.vf/(2*L), af=C/v.sf; return {L,C,af}; },
  statement:(v)=>`In a gas gun, expanding gas accelerates a projectile with a = C/s, where s is its distance from the breech and C is a constant. The projectile starts from rest at s = ${N(v.s0,"m")} and leaves the barrel at s = ${N(v.sf,"m")} with a speed of ${N(v.vf,"m/s")}. Find C and the acceleration at the muzzle.`,
  given:(v)=>[["a(s)","C / s"],["s₀, v₀",`${fmt(v.s0)} m, 0`],["s_f",`${fmt(v.sf)} m`],["v_f",`${fmt(v.vf)} m/s`]],
  find:["Gas constant C","Muzzle acceleration a_f"],
  method:"Acceleration is a function of position, so use the chain rule: a = (dv/dt)(ds/ds) = v dv/ds, giving a ds = v dv. Assume isothermal (constant-temperature) expansion.",
  answers:(v,r)=>[
    {label:"Constant C", unit:"m²/s²", val:r.C},
    {label:"Muzzle acceleration a_f", unit:"m/s²", val:r.af}],
  steps(v,r){ return [
    {t:"Chain rule to remove time", eq:T`a(s)=\frac{dv}{dt}\cdot\frac{ds}{ds}=v\frac{dv}{ds}\;\Rightarrow\;a(s)\,ds=v\,dv`},
    {t:"Substitute a = C/s and integrate", eq:T`C\int_{${fmt(v.s0)}}^{${fmt(v.sf)}}\frac{1}{s}\,ds=\int_0^{${fmt(v.vf)}}v\,dv`},
    {t:"Evaluate", eq:T`C\big[\ln s\big]_{${fmt(v.s0)}}^{${fmt(v.sf)}}=\frac{v^2}{2}\Big|_0^{${fmt(v.vf)}}\;\Rightarrow\;C\ln\!\frac{${fmt(v.sf)}}{${fmt(v.s0)}}=\frac{${fmt(v.vf)}^2}{2}`},
    {t:"Solve for C", eq:T`${fmt(r.L)}\,C=${fmt(v.vf*v.vf/2,6)}\;\Rightarrow\;C=${fmt(r.C)}\ \text{m}^2/\text{s}^2`},
    {t:"Acceleration at the muzzle", eq:T`a_f=\frac{C}{s_f}=\frac{${fmt(r.C)}}{${fmt(v.sf)}}=${fmt(r.af)}\ \text{m/s}^2`}
  ];},
  takeaway:(v,r)=>`That is about ${fmt(r.af/g,3)} g. The acceleration is largest at the breech (s₀) and falls off as the gas expands.`,
  plot(v,r){ const pts=[]; for(let i=0;i<=80;i++){const s=v.s0+(v.sf-v.s0)*i/80; pts.push([s,Math.sqrt(2*r.C*Math.log(s/v.s0))]);} return {xl:"s (m)", yl:"v (m/s)", series:[{pts,label:"v(s)"}], mark:[v.sf,v.vf], xmin:0, cap:"Speed along the barrel, v(s) = √(2C ln(s/s₀)). The dot marks the muzzle."}; }
},

/* ---------- 5. Survey plane drop: projectile ---------- */
{
  id:"survey", topic:"Particle Kinematics · Cartesian", name:"Survey Plane Drop", tag:"2-D projectile",
  kind:"Curvilinear motion (parabolic)",
  original:{ vx:40, h:30 },
  randomize(){ return { vx:pick(25,70,5), h:pick(20,120,5) }; },
  solve(v){ const t=Math.sqrt(2*v.h/g), d=v.vx*t; return {t,d}; },
  statement:(v)=>`A survey plane flies level at ${N(v.h,"m")} above the ground with a constant horizontal speed of ${N(v.vx,"m/s")} and releases a marker. Neglecting air resistance, find the time of fall and the horizontal distance d the marker travels before it hits the ground. Use g = 9.81 m/s².`,
  given:(v)=>[["v₀ (horizontal)",`${fmt(v.vx)} m/s`],["h",`${fmt(v.h)} m`],["a",`aₓ = 0, a_y = −g`],["v₁y, t₁","0, 0"]],
  find:["Fall time t₂","Horizontal distance d"],
  method:"Inertial Cartesian frame at the ground below the release point. Acceleration is constant (−g ĵ), so integrate a = dv/dt, then v = dr/dt, and split the vector equation into î and ĵ scalar equations.",
  answers:(v,r)=>[
    {label:"Fall time t₂", unit:"s", val:r.t},
    {label:"Distance d", unit:"m", val:r.d}],
  steps(v,r){ return [
    {t:"Integrate acceleration", eq:T`\vec a=\frac{d\vec v}{dt}=-g\,\hat{j}\;\Rightarrow\;\vec v(t)=${fmt(v.vx)}\,\hat{i}-${fmt(g)}\,t\,\hat{j}`},
    {t:"Repeat for position (start at height h)", eq:T`\int_0^{t}\vec v\,dt=\int_{\vec r_0}^{\vec r}d\vec r\;\Rightarrow\;\vec r(t)=${fmt(v.vx)}\,t\,\hat{i}+\Big(${fmt(v.h)}-\tfrac{${fmt(g)}}{2}t^2\Big)\hat{j}`,
      note:"One vector equation gives two scalar equations."},
    {t:"ĵ equation: hits the ground at y = 0", eq:T`0=${fmt(v.h)}-\frac{${fmt(g)}}{2}t_2^2\;\Rightarrow\;t_2=\sqrt{\frac{2(${fmt(v.h)})}{${fmt(g)}}}=${fmt(r.t)}\ \text{s}`},
    {t:"î equation: horizontal distance", eq:T`d=v_0\,t_2=${fmt(v.vx)}(${fmt(r.t)})=${fmt(r.d)}\ \text{m}`}
  ];},
  takeaway:"Cartesian coordinates fit projectile motion because aₓ only affects vₓ and a_y only affects v_y. With drag, F_D = −c v|v| makes aₓ and a_y depend on both components, so the equations become coupled.",
  plot(v,r){ const pts=[]; for(let i=0;i<=60;i++){const t=r.t*i/60; pts.push([v.vx*t, v.h-0.5*g*t*t]);} return {xl:"x (m)", yl:"y (m)", series:[{pts,label:"path"}], mark:[r.d,0], equal:true, cap:"Trajectory drawn to scale. The dot marks the impact point at distance d."}; }
}

];

/* =====================================================================
   APP
   ===================================================================== */
const state = { id: PROBLEMS[0].id, vars:null, isOriginal:true, shown:0, variant:1 };
const $ = (s)=>document.querySelector(s);
const cur = ()=>PROBLEMS.find(p=>p.id===state.id);

function renderNav(){
  const topics=[...new Set(PROBLEMS.map(p=>p.topic))];
  $("#nav").innerHTML = topics.map(tp=>`<div class="topic"><h2>${tp}</h2><ul>${
    PROBLEMS.filter(p=>p.topic===tp).map(p=>`<li><button type="button" data-id="${p.id}" aria-current="${p.id===state.id}"><span class="pname">${p.name}</span><span class="ptag">${p.tag}</span></button></li>`).join("")
  }</ul></div>`).join("") + `<p class="soon">More topics will appear here as they are added.</p>`;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>select(b.dataset.id));
}

function select(id){
  state.id=id; state.vars={...cur().original}; state.isOriginal=true; state.shown=0; state.variant=1;
  try{ localStorage.setItem("dpl-last", id); }catch(e){}
  renderNav(); renderSheet(); window.scrollTo({top:0});
}
function fresh(){ state.vars=cur().randomize(); state.isOriginal=false; state.shown=0; state.variant++; renderSheet(); }
function original(){ state.vars={...cur().original}; state.isOriginal=true; state.shown=0; renderSheet(); }

function renderSheet(){
  const p=cur(), v=state.vars, r=p.solve(v), ans=p.answers(v,r);
  const steps=p.steps(v,r);
  $("#sheet").innerHTML = `
    <div class="phead">
      <div><div class="eyebrow">${p.kind} · ${p.tag}</div><h2>${p.name}</h2></div>
      <div class="controls">
        <button class="btn primary" id="new" type="button">New numbers</button>
        <button class="btn" id="orig" type="button">Class example</button>
      </div>
    </div>
    <div class="variant">${state.isOriginal ? "Showing the numbers from the class notes" : "Practice version #"+(state.variant-1)+" · random givens"}</div>
    <p class="statement">${p.statement(v,r)}</p>
    <div class="cols">
      <div class="box"><h3>Given</h3><ul>${p.given(v,r).map(([k,x])=>`<li><span>${k}</span><span class="v">${x}</span></li>`).join("")}</ul></div>
      <div class="box"><h3>Find</h3><ul>${p.find.map(f=>`<li><span>${f}</span></li>`).join("")}</ul></div>
    </div>
    <p class="method"><b>Method.</b> ${p.method}</p>

    <form class="answers" id="ansform" autocomplete="off">
      <h3>Your answers</h3>
      ${ans.map((a,i)=>`<div class="arow">
        <label for="a${i}">${a.label}</label>
        <div class="inp"><input id="a${i}" inputmode="decimal" placeholder="e.g. 12.3"><span class="unit">${a.unit}</span></div>
        <span class="chip idle" id="c${i}">not checked</span></div>`).join("")}
      <div class="checkbar">
        <button class="btn primary" type="submit">Check answers</button>
        <button class="btn" type="button" id="next">Show next step</button>
        <button class="btn" type="button" id="all">Show full solution</button>
        <span class="hint">Correct within 1%.</span>
      </div>
    </form>
    <section id="sol" class="solution" ${state.shown?"":"hidden"}></section>`;

  $("#new").onclick=fresh; $("#orig").onclick=original;
  $("#next").onclick=()=>{ state.shown=Math.min(state.shown+1, steps.length); drawSolution(p,v,r,ans,steps); };
  $("#all").onclick=()=>{ state.shown=steps.length; drawSolution(p,v,r,ans,steps); };
  $("#ansform").onsubmit=(e)=>{ e.preventDefault(); ans.forEach((a,i)=>check(a,i)); };
  if(state.shown) drawSolution(p,v,r,ans,steps);
}

function check(a,i){
  const raw=$("#a"+i).value.trim().replace(/,/g,""), chip=$("#c"+i);
  if(raw===""){ chip.className="chip idle"; chip.textContent="enter a value"; return; }
  const x=parseFloat(raw);
  if(isNaN(x)){ chip.className="chip bad"; chip.textContent="not a number"; return; }
  const err=Math.abs(x-a.val)/Math.max(Math.abs(a.val),1e-9);
  if(err<=0.01){ chip.className="chip good"; chip.textContent="correct"; }
  else if(err<=0.05){ chip.className="chip warn"; chip.textContent="close, check rounding"; }
  else if(Math.abs(x+a.val)/Math.max(Math.abs(a.val),1e-9)<=0.01){ chip.className="chip warn"; chip.textContent="check the sign"; }
  else { chip.className="chip bad"; chip.textContent="not yet"; }
}

function drawSolution(p,v,r,ans,steps){
  const sol=$("#sol"); sol.hidden=false;
  const done = state.shown>=steps.length;
  const tk = typeof p.takeaway==="function" ? p.takeaway(v,r) : p.takeaway;
  sol.innerHTML = `<h3>Worked solution</h3>
    <ol class="steps">${steps.slice(0,state.shown).map(s=>`<li><span class="step-title">${s.t}</span><div class="step-body"><div class="eq">${tex(s.eq)}</div>${s.note?`<p class="note">${s.note}</p>`:""}</div></li>`).join("")}</ol>
    ${done ? `
      <div class="final">${ans.map(a=>`<div class="ans"><div class="k">${a.label}</div><div class="val">${fmt(a.val)} ${a.unit}</div></div>`).join("")}</div>
      <p class="takeaway"><b>Takeaway.</b> ${tk}</p>
      <figure class="plotwrap" style="margin:0"><figcaption id="cap"></figcaption><canvas id="plot"></canvas></figure>`
      : `<p class="note">Step ${state.shown} of ${steps.length}. Try the next step yourself before revealing it.</p>`}`;
  if(done) drawPlot(p.plot(v,r));
}

function drawPlot(P){
  const cv=$("#plot"); if(!cv) return; $("#cap").textContent=P.cap;
  const css=getComputedStyle(document.documentElement), col=(n)=>css.getPropertyValue(n).trim();
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const all=P.series.flatMap(s=>s.pts);
  let x0=P.xmin??Math.min(0,...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0]));
  let y0=Math.min(0,...all.map(p=>p[1])), y1=Math.max(...all.map(p=>p[1]));
  const padY=(y1-y0)*0.08||1; y1+=padY; if(y0<0) y0-=padY;
  const L=58,R=16,Tp=12,B=40, pw=W-L-R, ph=H-Tp-B;
  let sx=pw/(x1-x0), sy=ph/(y1-y0);
  if(P.equal){ const s=Math.min(sx,sy); sx=sy=s; }
  const X=(x)=>L+(x-x0)*sx, Y=(y)=>Tp+ph-(y-y0)*sy;
  const nice=(span)=>{const r=span/5, m=Math.pow(10,Math.floor(Math.log10(r))), f=r/m; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*m;};
  c.font="12px "+col("--mono"); c.lineWidth=1;
  const xs=nice(P.equal?(pw/sx):(x1-x0)), ys=nice(P.equal?(ph/sy):(y1-y0));
  const xEnd=x0+pw/sx, yEnd=y0+ph/sy;
  c.strokeStyle=col("--line"); c.fillStyle=col("--muted");
  c.textAlign="center"; c.textBaseline="top";
  for(let x=Math.ceil(x0/xs)*xs; x<=xEnd+1e-9; x+=xs){ c.beginPath(); c.moveTo(X(x),Tp); c.lineTo(X(x),Tp+ph); c.stroke(); c.fillText(fmt(x,3),X(x),Tp+ph+6); }
  c.textAlign="right"; c.textBaseline="middle";
  for(let y=Math.ceil(y0/ys)*ys; y<=yEnd+1e-9; y+=ys){ c.beginPath(); c.moveTo(L,Y(y)); c.lineTo(L+pw,Y(y)); c.stroke(); c.fillText(fmt(y,3),L-6,Y(y)); }
  c.strokeStyle=col("--muted"); c.beginPath(); c.moveTo(L,Y(Math.max(0,y0))); c.lineTo(L+pw,Y(Math.max(0,y0))); c.moveTo(L,Tp); c.lineTo(L,Tp+ph); c.stroke();
  c.fillStyle=col("--muted"); c.textAlign="right"; c.textBaseline="bottom"; c.fillText(P.xl,L+pw,H-2);
  c.save(); c.translate(12,Tp+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.textBaseline="middle"; c.fillText(P.yl,0,0); c.restore();
  P.series.forEach(s=>{ c.strokeStyle=s.alt?col("--plot-2"):col("--accent"); c.lineWidth=2.25; c.beginPath(); s.pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))); c.stroke(); });
  const dot=(m,color)=>{ c.fillStyle=color; c.strokeStyle=col("--surface-2"); c.lineWidth=2; c.beginPath(); c.arc(X(m[0]),Y(m[1]),5,0,7); c.fill(); c.stroke(); };
  if(P.mark) dot(P.mark,col("--accent")); if(P.mark2) dot(P.mark2,col("--plot-2"));
}

window.addEventListener("resize",()=>{ if(state.shown && !$("#sol").hidden){ const p=cur(), v=state.vars, r=p.solve(v); if(state.shown>=p.steps(v,r).length) drawPlot(p.plot(v,r)); }});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>window.dispatchEvent(new Event("resize")));

let start=PROBLEMS[0].id; try{ const s=localStorage.getItem("dpl-last"); if(s && PROBLEMS.some(p=>p.id===s)) start=s; }catch(e){}
state.id=start; state.vars={...cur().original};
renderNav(); renderSheet();
</script>
</body></html>
